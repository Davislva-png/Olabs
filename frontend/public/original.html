/* Olabs — component styles. Every value comes from tokens.css; prefix ol-. */
body { margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
.ol-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-5); }
.ol-col { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); }
.ol-icon { flex: none; display: block; }
.ol-link { font: inherit; font-weight: 700; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.ol-link:hover { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
button { font-family: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--focus-ring); }

/* ---------- Logo */
.ol-logo-tile { display: inline-grid; place-items: center; flex: none; border-radius: var(--radius-md); background: var(--feature); color: var(--on-feature); }

/* ---------- Button */
.ol-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-md); padding: 0 18px; border: 0; border-radius: var(--radius-full); font: inherit; font-size: 13px; line-height: 18px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: background-color .15s, box-shadow .15s, color .15s; }
.ol-btn--sm { height: var(--control-sm); padding: 0 14px; font-size: 12.5px; gap: 6px; }
.ol-btn--lg { height: var(--control-lg); padding: 0 22px; font-size: 14px; }
.ol-btn--icononly { padding: 0; width: var(--control-md); }
.ol-btn--primary { background: var(--primary); color: var(--on-primary); }
.ol-btn--primary:hover { background: color-mix(in srgb, var(--primary) 86%, var(--canvas)); }
.ol-btn--secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.ol-btn--secondary:hover { background: var(--surface-sunken); }
.ol-btn--ghost { background: transparent; color: var(--ink); }
.ol-btn--ghost:hover { background: var(--surface-muted); }
.ol-btn--coral { background: var(--coral); color: var(--on-coral); }
.ol-btn--coral:hover { background: color-mix(in srgb, var(--coral) 88%, var(--ink)); }
.ol-btn--danger { background: transparent; color: var(--danger); }
.ol-btn--danger:hover { background: var(--danger-soft); }
.ol-btn:disabled { opacity: .45; cursor: not-allowed; }
.ol-btn:focus-visible { box-shadow: var(--focus-ring); }

/* ---------- IconButton */
.ol-iconbtn { position: relative; display: inline-grid; place-items: center; flex: none; width: var(--control-md); height: var(--control-md); padding: 0; border: 0; border-radius: var(--radius-full); color: var(--ink); cursor: pointer; transition: background-color .15s, color .15s; }
.ol-iconbtn--sm { width: var(--control-sm); height: var(--control-sm); }
.ol-iconbtn--lg { width: var(--control-lg); height: var(--control-lg); }
.ol-iconbtn--surface { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ol-iconbtn--surface:hover { background: var(--surface-sunken); }
.ol-iconbtn--ghost { background: transparent; color: var(--ink-muted); }
.ol-iconbtn--ghost:hover { background: var(--surface-muted); color: var(--ink); }
.ol-iconbtn--primary { background: var(--primary); color: var(--on-primary); }
.ol-iconbtn--onfeature { background: color-mix(in srgb, var(--on-feature) 12%, transparent); color: var(--on-feature); }
.ol-iconbtn--onfeature:hover { background: color-mix(in srgb, var(--on-feature) 20%, transparent); }
.ol-iconbtn__badge { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 2px var(--surface); }
.ol-iconbtn--lg .ol-iconbtn__badge { top: 11px; right: 12px; }
.ol-favbtn.is-active { color: var(--amber); }
.ol-favbtn.is-active svg { fill: var(--amber); }

/* ---------- Avatar */
.ol-avatar { position: relative; display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 700; letter-spacing: -.01em; line-height: 1; user-select: none; }
.ol-avatar--ring { box-shadow: 0 0 0 2px var(--surface); }
.ol-avatar__dot { position: absolute; right: -1px; bottom: -1px; border-radius: 50%; background: var(--online); box-shadow: 0 0 0 2px var(--surface); }
.ol-avatar--more { background: var(--surface-muted); color: var(--ink-muted); }
.ol-avatars { display: inline-flex; align-items: center; }
.ol-avatars > .ol-avatar + .ol-avatar { margin-left: -8px; }
.ol-person { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
.ol-person__txt { display: flex; flex-direction: column; min-width: 0; }
.ol-person__name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-person__sub { font-size: 12px; line-height: 16px; color: var(--ink-muted); white-space: nowrap; }
.ol-ptile { display: inline-grid; place-items: center; flex: none; font-weight: 800; letter-spacing: .02em; line-height: 1; }

/* ---------- StageBadge */
.ol-stage { box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px 0 10px; border: 0; border-radius: var(--radius-full); font: inherit; font-size: 12.5px; line-height: 16px; font-weight: 700; white-space: nowrap; }
.ol-stage--sm { height: 24px; padding: 0 10px 0 8px; font-size: 12px; gap: 6px; }
.ol-stage__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ol-stage--block { display: flex; width: 100%; justify-content: center; height: 32px; border-radius: var(--radius-md); }
button.ol-stage { cursor: pointer; }

/* ---------- Priority */
.ol-prio { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.ol-prio__icon { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: var(--radius-sm); }
.ol-prio--compact { font-size: 12px; gap: 5px; }
.ol-prio--compact .ol-prio__icon { width: 20px; height: 20px; }

/* ---------- Tag */
.ol-tags { display: inline-flex; gap: 6px; align-items: center; flex-wrap: nowrap; min-width: 0; }
.ol-tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 0; border-radius: var(--radius-sm); font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; color: var(--ink-muted); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.ol-tag__dot { width: 6px; height: 6px; border-radius: 2px; flex: none; }
.ol-tag--main { box-shadow: none; font-weight: 700; }
.ol-tag--more { color: var(--ink-muted); }
.ol-tag--add { width: 24px; padding: 0; justify-content: center; cursor: pointer; }
.ol-tag__x { display: inline-grid; place-items: center; margin-right: -4px; padding: 0; width: 16px; height: 16px; border: 0; border-radius: 4px; background: transparent; color: inherit; cursor: pointer; }

/* ---------- DueDate */
.ol-due { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px 0 7px; border-radius: var(--radius-full); font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--ink); }
.ol-due--normal { padding-left: 0; }
.ol-due--normal .ol-icon { color: var(--ink-muted); }
.ol-due--late { background: var(--danger-soft); color: var(--danger); }
.ol-due--today { background: var(--amber-soft); color: var(--amber-strong); }
.ol-due--soon { background: var(--sky-soft); color: var(--sky-strong); }
.ol-due--done { color: var(--ink-muted); padding-left: 0; font-weight: 600; }
.ol-due--none { color: var(--ink-muted); font-weight: 600; padding-left: 0; }

/* ---------- ViewTabs */
.ol-tabs { align-self: flex-start; display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.ol-tabs__item { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-sm); padding: 0 14px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--ink-muted); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.ol-tabs__item:hover { color: var(--ink); background: var(--surface-sunken); }
.ol-tabs__item.is-active { background: var(--primary); color: var(--on-primary); }
.ol-tabs__count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); display: inline-grid; place-items: center; font-size: 11px; background: var(--surface-muted); color: var(--ink); }
.ol-tabs__item.is-active .ol-tabs__count { background: color-mix(in srgb, var(--on-primary) 18%, transparent); color: var(--on-primary); }
.ol-tabs--lg .ol-tabs__item { height: var(--control-md); padding: 0 18px; }

/* ---------- Card */
.ol-card { background: var(--surface); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-sm); min-width: 0; }
.ol-card--flush { padding: 0; }
.ol-card--flush > .ol-card__head { padding: var(--space-6) var(--space-6) var(--space-4); }
.ol-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
.ol-card--flush > .ol-card__head { margin-bottom: 0; }
.ol-card__title { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -.01em; }
.ol-card__sub { margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.ol-card__actions { display: flex; align-items: center; gap: var(--space-2); flex: none; }
.ol-span2 { grid-column: span 2; }

/* ---------- StatTile */
.ol-stat { background: var(--surface); border-radius: var(--radius-xl); padding: var(--space-5) var(--space-6); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ol-stat__top { display: flex; align-items: center; gap: var(--space-3); }
.ol-stat__icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-full); flex: none; }
.ol-stat__label { font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.ol-stat__value { font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.ol-stat__hint { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-muted); }

/* ---------- StageBar */
.ol-stagebar { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ol-stagebar__track { display: flex; gap: 3px; border-radius: var(--radius-full); overflow: hidden; background: var(--surface-muted); }
.ol-stagebar__track > span { display: block; min-width: 6px; }
.ol-stagebar__legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; font-weight: 600; color: var(--ink-muted); }
.ol-stagebar__item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ol-stagebar__item b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.ol-stagebar__dot { width: 8px; height: 8px; border-radius: 50%; }

/* ---------- StageProgress */
.ol-steps { display: flex; margin: 0; padding: 0; list-style: none; }
.ol-steps__item { flex: 1; position: relative; min-width: 0; }
.ol-steps__item + .ol-steps__item::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 3px; border-radius: 2px; background: var(--surface-muted); z-index: 0; }
.ol-steps__item.is-done + .ol-steps__item::before, .ol-steps__item.is-done + .ol-steps__item.is-current::before { background: var(--teal); }
.ol-steps__btn { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; padding: 0; border: 0; background: none; font: inherit; cursor: pointer; color: var(--ink-muted); }
.ol-steps__node { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font-size: 12px; font-weight: 700; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--ink-muted); transition: transform .15s; }
.ol-steps__btn:hover .ol-steps__node { transform: scale(1.06); }
.ol-steps__item.is-done .ol-steps__node { background: var(--teal); box-shadow: none; color: var(--surface); }
.ol-steps__item.is-current .ol-steps__node { background: var(--csoft); box-shadow: inset 0 0 0 2px var(--c), 0 0 0 4px var(--csoft); }
.ol-steps__core { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.ol-steps__label { font-size: 12px; line-height: 16px; font-weight: 600; text-align: center; padding: 0 4px; }
.ol-steps__item.is-done .ol-steps__label { color: var(--ink); }
.ol-steps__item.is-current .ol-steps__label { color: var(--cs); font-weight: 800; }

/* ---------- WorkloadBar */
.ol-load { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.ol-load__track { flex: 1; display: flex; gap: 2px; height: 10px; border-radius: var(--radius-full); background: var(--surface-muted); overflow: hidden; min-width: 80px; }
.ol-load__track > span { display: block; height: 100%; }
.ol-load__n { width: 20px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Fields */
.ol-search { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--control-md); padding: 0 14px; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-muted); box-sizing: border-box; min-width: 0; }
.ol-search--sm { height: var(--control-sm); padding: 0 12px; }
.ol-search--lg { height: var(--control-lg); padding: 0 18px; gap: 10px; }
.ol-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--ink); }
.ol-search input::placeholder { color: var(--ink-muted); }
.ol-search:focus-within { box-shadow: var(--focus-ring); }
.ol-search kbd { font: inherit; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: var(--radius-xs); background: var(--surface-muted); color: var(--ink-muted); }
.ol-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ol-field__label { font-size: 13px; line-height: 18px; font-weight: 700; }
.ol-field__box { display: flex; align-items: center; gap: var(--space-2); min-height: var(--control-md); padding: 0 14px; border: 0; border-radius: var(--radius-md); background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-muted); font: inherit; box-sizing: border-box; text-align: left; }
.ol-field__box:focus-within { box-shadow: var(--focus-ring); background: var(--surface); }
.ol-field__box input, .ol-field__box textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); resize: none; }
.ol-field__box input::placeholder, .ol-field__box textarea::placeholder { color: var(--ink-muted); }
.ol-field__box--multi { align-items: flex-start; padding: 10px 14px; }
.ol-field__box--multi textarea { line-height: 22px; }
.ol-field__select { cursor: pointer; color: var(--ink-muted); }
.ol-field__select > span { flex: 1; color: var(--ink); font-size: 14px; }
.ol-field__hint { font-size: 12px; line-height: 16px; color: var(--ink-muted); font-weight: 600; }
.ol-formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.ol-formstack { display: flex; flex-direction: column; gap: var(--space-4); align-items: stretch; }

/* ---------- Switch / Checkbox */
.ol-switchrow { display: flex; align-items: center; gap: var(--space-4); justify-content: space-between; }
.ol-switchrow__txt { display: flex; flex-direction: column; gap: 2px; }
.ol-switchrow__label { font-weight: 700; }
.ol-switchrow__desc { font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.ol-switch { position: relative; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: var(--radius-full); background: var(--surface-muted); box-shadow: inset 0 0 0 1.5px var(--line-strong); cursor: pointer; transition: background-color .2s; }
.ol-switch__knob { position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--line-strong); transition: transform .2s, background-color .2s; }
.ol-switch.is-on { background: var(--primary); box-shadow: none; }
.ol-switch.is-on .ol-switch__knob { transform: translateX(18px); background: var(--on-primary); }
.ol-check { display: inline-grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: var(--radius-xs); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line-strong); color: var(--on-primary); cursor: pointer; }
.ol-check.is-on { background: var(--primary); box-shadow: none; }

/* ---------- Files */
.ol-fileicon { display: inline-grid; place-items: center; flex: none; border-radius: var(--radius-md); }
.ol-attach { display: flex; align-items: center; gap: var(--space-3); padding: 10px 12px; border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-attach__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ol-attach__name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-attach__meta { font-size: 12px; line-height: 16px; color: var(--ink-muted); font-weight: 600; }
.ol-attachlist { display: flex; flex-direction: column; gap: var(--space-2); }
.ol-filetile { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ol-filetile__thumb { position: relative; height: 108px; display: grid; place-items: center; margin: 8px 8px 0; border-radius: var(--radius-md); }
.ol-filetile__type { position: absolute; left: 10px; top: 10px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--radius-full); background: var(--surface); color: var(--ink); }
.ol-filetile__body { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 14px; min-width: 0; }
.ol-filetile__name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-filetile__demand { font-size: 12px; line-height: 16px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.ol-filetile__demand b { color: var(--ink); }
.ol-filetile__foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.ol-filetile__size { margin-left: auto; }

/* ---------- Comments / activity */
.ol-comment { display: flex; gap: var(--space-3); }
.ol-comment__body { flex: 1; min-width: 0; padding: 10px 14px 12px; border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg); background: var(--surface-sunken); }
.ol-comment--mine .ol-comment__body { background: var(--sky-soft); }
.ol-comment__head { display: flex; gap: var(--space-2); align-items: baseline; font-size: 13px; }
.ol-comment__head span { font-size: 12px; color: var(--ink-muted); font-weight: 600; }
.ol-comment p { margin: 4px 0 0; font-size: 14px; line-height: 21px; }
.ol-composer { display: flex; align-items: center; gap: var(--space-3); }
.ol-composer__box { flex: 1; display: flex; align-items: center; gap: 4px; height: var(--control-lg); padding: 0 6px 0 16px; border-radius: var(--radius-full); background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line); }
.ol-composer__box:focus-within { box-shadow: var(--focus-ring); }
.ol-composer__box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
.ol-composer__box input::placeholder { color: var(--ink-muted); }
.ol-activity { display: flex; gap: var(--space-3); align-items: flex-start; }
.ol-activity__avatar { position: relative; flex: none; }
.ol-activity__icon { position: absolute; right: -7px; bottom: -5px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: var(--on-primary); box-shadow: 0 0 0 2px var(--surface); }
.ol-activity__txt { min-width: 0; }
.ol-activity__txt p { margin: 0; font-size: 13.5px; line-height: 19px; }
.ol-activity__txt > span { font-size: 12px; color: var(--ink-muted); font-weight: 600; }

/* ---------- Modal */
.ol-scrim { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: color-mix(in srgb, var(--feature) 34%, transparent); padding: var(--space-6); }
.ol-modal { max-width: 100%; background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
.ol-modal__head { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-6) var(--space-6) 0; }
.ol-modal__head h2 { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.015em; }
.ol-modal__head p { margin: 4px 0 0; color: var(--ink-muted); font-size: 13.5px; }
.ol-modal__body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.ol-modal__foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--line); }
.ol-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.ol-option { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: var(--space-4); border: 0; border-radius: var(--radius-lg); background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line); font: inherit; text-align: left; cursor: pointer; color: var(--ink); }
.ol-option > span:not(.ol-option__icon):not(.ol-option__radio) { font-size: 12.5px; line-height: 17px; color: var(--ink-muted); font-weight: 600; }
.ol-option__icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--surface); margin-bottom: 6px; }
.ol-option__radio { position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.ol-option.is-active { background: var(--surface); box-shadow: inset 0 0 0 2px var(--primary); }
.ol-option.is-active .ol-option__radio { box-shadow: inset 0 0 0 5px var(--primary); }
.ol-copyfrom { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-copyfrom .ol-field__box { background: var(--surface); }
.ol-copyfrom__flow, .ol-flowpreview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink-muted); }
.ol-people-pick { display: flex; align-items: center; gap: var(--space-3); }

/* ---------- Empty */
.ol-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: var(--space-8) var(--space-6); color: var(--ink-muted); }
.ol-empty__icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--surface-muted); color: var(--ink); margin-bottom: 4px; }
.ol-empty b { color: var(--ink); font-size: 15px; }
.ol-empty p { margin: 0 0 8px; max-width: 320px; font-size: 13px; line-height: 19px; }

/* ================= App shell */
.ol-app { position: relative; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); background: var(--canvas); color: var(--ink); overflow: hidden; }
.ol-main { min-width: 0; padding: var(--space-6) var(--space-8) var(--space-10) var(--space-2); }
.ol-screen { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }

.ol-sidebar { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-6) var(--space-4); min-width: 0; }
.ol-sidebar__brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2) var(--space-2); color: var(--ink); }
.ol-nav { display: flex; flex-direction: column; gap: 2px; }
.ol-nav__section { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3) 6px; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-nav__add { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--surface); color: var(--ink); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
.ol-nav__item { display: flex; align-items: center; gap: var(--space-3); height: var(--control-md); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-full); background: transparent; color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer; min-width: 0; }
.ol-nav__item > .ol-icon { color: var(--ink-muted); }
.ol-nav__item:hover { background: var(--surface); }
.ol-nav__item.is-active { background: var(--primary); color: var(--on-primary); }
.ol-nav__item.is-active > .ol-icon { color: var(--on-primary); }
.ol-nav__label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-nav__fav { color: var(--amber); fill: var(--amber); }
.ol-nav__count { min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--radius-full); display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); box-sizing: border-box; }
.ol-nav__item.is-active .ol-nav__count { background: color-mix(in srgb, var(--on-primary) 16%, transparent); color: var(--on-primary); box-shadow: none; }
.ol-nav--projects .ol-nav__item { height: 38px; }
.ol-sidebar__foot { margin-top: auto; }
.ol-me { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: 8px 12px 8px 8px; border: 0; border-radius: var(--radius-full); background: var(--surface); box-shadow: var(--shadow-sm); font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.ol-me.is-active { box-shadow: inset 0 0 0 2px var(--primary); }
.ol-me__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ol-me__txt b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-me__txt span { font-size: 12px; color: var(--ink-muted); font-weight: 600; }

.ol-topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-5); min-height: var(--control-lg); }
.ol-topbar__title { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.ol-topbar h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.02em; }
.ol-topbar p { margin: 2px 0 0; color: var(--ink-muted); font-size: 13.5px; line-height: 19px; }
.ol-topbar__tools { display: flex; align-items: center; gap: var(--space-3); flex: none; }
.ol-userchip { display: flex; align-items: center; gap: 10px; height: var(--control-lg); padding: 0 14px 0 6px; border: 0; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: inherit; color: var(--ink); cursor: pointer; text-align: left; }

/* ---------- Início */
.ol-hero { position: relative; min-height: 300px; box-sizing: border-box; border-radius: var(--radius-xl); background-color: var(--sky); background-repeat: no-repeat; background-size: max(600px, calc(100% - 340px)) auto; background-position: right -24px center; display: flex; align-items: center; padding: var(--space-5); overflow: hidden; }

.ol-hero__date { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-hero__hello { margin: 0; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -.025em; }
.ol-hero__text { margin: 0; font-size: 15px; line-height: 22px; color: var(--ink); }

.ol-hero__actions { display: flex; gap: var(--space-2); margin-top: 4px; }
.ol-hero__chip { position: absolute; right: var(--space-5); bottom: var(--space-5); display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); }
.ol-hero__chip b { font-size: 15px; }
.ol-hero__chip .ol-icon { color: var(--amber-strong); }

.ol-homegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); align-items: stretch; }
.ol-mylist { display: flex; flex-direction: column; margin: 0 calc(var(--space-3) * -1); }
.ol-mylist__row { display: grid; grid-template-columns: minmax(0, 1fr) 190px 104px 128px; align-items: center; gap: var(--space-3); min-height: 50px; padding: 0 var(--space-3); border: 0; border-top: 1px solid var(--line); background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; border-radius: 0; }
.ol-mylist__row:hover { background: var(--surface-sunken); border-radius: var(--radius-md); }
.ol-mylist__row--head { min-height: 32px; border-top: 0; cursor: default; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-mylist__row--head:hover { background: none; }
.ol-mylist__title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-mylist__proj { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; overflow: hidden; }

.ol-feature { background: var(--feature); color: var(--on-feature); border-radius: var(--radius-xl); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); box-shadow: var(--shadow-sm); min-width: 0; }
.ol-feature__head { display: flex; justify-content: space-between; align-items: flex-start; }

.ol-feature__head p { margin: 2px 0 0; font-size: 13px; color: var(--on-feature-muted); }
.ol-feature__mid { display: flex; align-items: center; gap: var(--space-5); }
.ol-feature__donut { position: relative; flex: none; width: 168px; height: 168px; }
.ol-feature__center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ol-feature__center b { font-size: 40px; line-height: 42px; font-weight: 700; letter-spacing: -.03em; }
.ol-feature__center span { font-size: 12.5px; color: var(--on-feature-muted); font-weight: 600; }
.ol-feature__legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.ol-feature__legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--on-feature-muted); }
.ol-feature__legend li span { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ol-feature__legend li b { margin-left: auto; color: var(--on-feature); font-size: 15px; font-variant-numeric: tabular-nums; }
.ol-feature__bars { display: flex; flex-direction: column; gap: var(--space-3); }
.ol-feature__barshead { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--on-feature-muted); }
.ol-feature__key { display: flex; align-items: center; gap: 6px; }
.ol-feature__key i { width: 8px; height: 8px; border-radius: 2px; margin-left: 6px; }
.ol-feature__chart { display: flex; justify-content: space-between; gap: var(--space-2); height: 96px; }
.ol-feature__col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ol-feature__pair { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.ol-feature__pair span { width: 10px; border-radius: var(--radius-full); min-height: 6px; }
.ol-feature__day { font-size: 11.5px; font-weight: 700; color: var(--on-feature-muted); }
.ol-feature__col.is-today .ol-feature__day { color: var(--on-feature); }

.ol-duelist, .ol-activitylist { display: flex; flex-direction: column; gap: var(--space-2); }
.ol-activitylist { gap: var(--space-4); }
.ol-duelist__row { display: flex; align-items: center; gap: var(--space-3); padding: 8px; margin: 0 -8px; border: 0; border-radius: var(--radius-md); background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.ol-duelist__row:hover { background: var(--surface-sunken); }
.ol-duelist__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ol-duelist__txt b { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-duelist__txt span { font-size: 12px; color: var(--ink-muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-recent { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.ol-recent__tile { display: flex; flex-direction: column; gap: 6px; padding: var(--space-4); border: 0; border-radius: var(--radius-lg); background: var(--surface-sunken); font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-width: 0; }
.ol-recent__tile:hover { background: var(--surface-muted); }
.ol-recent__top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; color: var(--ink-muted); }
.ol-recent__tile b { font-size: 14px; line-height: 19px; }
.ol-recent__tile > span { font-size: 12px; color: var(--ink-muted); font-weight: 600; margin-bottom: 4px; }

/* ---------- Quadro */
.ol-boardtitle { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }
.ol-boardtitle__row { display: flex; align-items: center; gap: 4px; }
.ol-boardtitle h1 { margin-right: 6px; white-space: nowrap; }
.ol-summary__people { display: flex; align-items: center; gap: var(--space-2); }
.ol-boardtitle p { max-width: 560px; }
.ol-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.ol-toolbar__right { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.ol-toolbar__sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
.ol-summary { display: flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-6); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); }
.ol-summary__lead { display: flex; align-items: center; gap: 10px; flex: none; }
.ol-summary__lead b { font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -.02em; }
.ol-summary__lead span { font-size: 12px; line-height: 15px; font-weight: 600; color: var(--ink-muted); }
.ol-summary__bar { flex: 1; min-width: 0; }
.ol-bulk { display: flex; align-items: center; gap: var(--space-2); padding: 6px 6px 6px 18px; border-radius: var(--radius-full); background: var(--primary); color: var(--on-primary); align-self: flex-start; }
.ol-bulk b { margin-right: 8px; font-size: 13px; }
.ol-bulk .ol-btn--ghost, .ol-bulk .ol-iconbtn--ghost { color: var(--on-primary); }
.ol-bulk .ol-btn--ghost:hover, .ol-bulk .ol-iconbtn--ghost:hover { background: color-mix(in srgb, var(--on-primary) 14%, transparent); }

.ol-groups { display: flex; flex-direction: column; gap: var(--space-4); }
.ol-group { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 6px 8px 8px; min-width: 0; }
.ol-group.is-collapsed { padding-bottom: 6px; }
.ol-group__head { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding-right: 4px; }
.ol-group__toggle { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border: 0; border-radius: var(--radius-full); background: none; font: inherit; color: var(--ink); cursor: pointer; }
.ol-group__toggle:hover { background: var(--surface-sunken); }
.ol-group__toggle > .ol-icon { color: var(--ink-muted); }
.ol-group__dot { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
.ol-group__name { font-size: 15px; line-height: 22px; font-weight: 700; color: var(--gcs); }
.ol-group__count { font-size: 12.5px; font-weight: 600; color: var(--ink-muted); }
.ol-group__mini { margin-left: auto; width: 240px; }
.ol-group__head > .ol-iconbtn { margin-left: auto; }
.ol-table { display: flex; flex-direction: column; }
.ol-table__row { display: grid; align-items: center; gap: 10px; min-height: var(--row); padding: 0 var(--space-3); border-top: 1px solid var(--line); cursor: pointer; border-radius: 0; }
.ol-table__row:hover:not(.ol-table__row--head):not(.ol-table__row--sum) { background: var(--surface-sunken); border-radius: var(--radius-md); border-top-color: transparent; }
.ol-table__row:hover + .ol-table__row { border-top-color: transparent; }
.ol-table__row.is-selected { background: var(--sky-soft); border-radius: var(--radius-md); }
.ol-table__row > span { min-width: 0; display: flex; align-items: center; }
.ol-table__row--head { min-height: 36px; border-top: 0; cursor: default; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-table__title { gap: 10px; }
.ol-table__id { flex: none; font-size: 12px; font-weight: 700; color: var(--ink-muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
.ol-table__title .ol-table__id { margin-right: 0; }
.ol-table__text { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ol-table__meta { display: flex; gap: 10px; margin-left: auto; flex: none; color: var(--ink-muted); font-size: 12px; font-weight: 700; }
.ol-table__meta > span { display: inline-flex; align-items: center; gap: 4px; }
.ol-table__proj { gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; overflow: hidden; }
.ol-table__row--add { cursor: default; min-height: 44px; }
.ol-table__row--add:hover { background: none !important; }
.ol-table__add { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; margin-left: -12px; border: 0; border-radius: var(--radius-full); background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-muted); cursor: pointer; }
.ol-table__add:hover { background: var(--surface-sunken); color: var(--ink); }
.ol-table__row--sum { cursor: default; min-height: 40px; }
.ol-table__range { font-size: 12px; font-weight: 700; color: var(--ink-muted); white-space: nowrap; }
.ol-table__sumbar > .ol-stagebar { width: 100%; }
.ol-addgroup { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-full); background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-muted); cursor: pointer; }

/* ---------- Kanban */
.ol-kanban { display: grid; gap: var(--space-4); align-items: start; overflow-x: auto; padding-bottom: 4px; }
.ol-kcol { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.ol-kcol__head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 0; }
.ol-kcol__count { font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.ol-kcol__head .ol-iconbtn { margin-left: auto; }
.ol-kcol__list { display: flex; flex-direction: column; gap: var(--space-3); }
.ol-kcol__empty { padding: var(--space-5); border: 1.5px dashed var(--line-strong); border-radius: var(--radius-lg); text-align: center; font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.ol-kcol__more { height: 36px; border: 0; border-radius: var(--radius-full); background: var(--surface-muted); font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
.ol-kcol--new { align-items: center; justify-content: center; flex-direction: row; gap: 8px; width: 48px; height: 48px; padding: 0; margin-top: 2px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-lg); background: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-muted); cursor: pointer; }
.ol-kcard { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-sm); cursor: pointer; transition: box-shadow .15s, transform .15s; }
.ol-kcard:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.ol-kcard:focus-visible { box-shadow: var(--focus-ring); }
.ol-kcard__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ol-kcard__id { font-size: 12px; font-weight: 700; color: var(--ink-muted); }
.ol-kcard__title { margin: 0; font-size: 14.5px; line-height: 20px; font-weight: 700; }
.ol-kcard__proj { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.ol-kcard__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ol-kcard__foot { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-3); border-top: 1px solid var(--line); }
.ol-kcard__counts { display: flex; gap: 10px; color: var(--ink-muted); font-size: 12px; font-weight: 700; }
.ol-kcard__counts > span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Calendar */
.ol-calcard { overflow: hidden; }
.ol-cal { display: flex; flex-direction: column; }
.ol-cal__head { display: flex; align-items: center; justify-content: space-between; padding: var(--space-5) var(--space-6); }
.ol-cal__head h3 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; }
.ol-cal__nav { display: flex; gap: var(--space-2); }
.ol-cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.ol-cal__wd { padding: 10px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); border-bottom: 1px solid var(--line); }
.ol-cal__cell { min-height: 112px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; box-sizing: border-box; }
.ol-cal__cell:nth-child(7n) { border-right: 0; }
.ol-cal__cell.is-weekend, .ol-cal__cell.is-out { background: var(--surface-sunken); }
.ol-cal__day { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.ol-cal__cell.is-today .ol-cal__day { background: var(--primary); color: var(--on-primary); }
.ol-cal__ev { display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); font: inherit; font-size: 12px; font-weight: 700; text-align: left; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ol-cal__evdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.ol-cal__more { font-size: 12px; font-weight: 700; color: var(--ink-muted); padding-left: 8px; }

/* ---------- Files view */
.ol-files { display: flex; flex-direction: column; gap: var(--space-4); }
.ol-files__bar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.ol-files__right { display: flex; gap: var(--space-2); }
.ol-files__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
.ol-chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.ol-chip { display: inline-flex; align-items: center; gap: 8px; height: var(--control-sm); padding: 0 6px 0 14px; border: 0; border-radius: var(--radius-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); cursor: pointer; }
.ol-chip span { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-full); display: inline-grid; place-items: center; font-size: 11px; background: var(--surface-muted); box-sizing: border-box; }
.ol-chip.is-active { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.ol-chip.is-active span { background: color-mix(in srgb, var(--on-primary) 18%, transparent); }

/* ---------- Drawer */
.ol-scrim--drawer { place-items: stretch end; padding: var(--space-3); }
.ol-drawer { width: 620px; max-width: 100%; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); overflow: hidden; }
.ol-drawer__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-3) var(--space-6); }
.ol-drawer__crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }
.ol-drawer__id { margin-left: 4px; padding: 3px 9px; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--ink); font-size: 12px; font-weight: 700; }
.ol-drawer__tools { display: flex; gap: 4px; }
.ol-drawer__scroll { flex: 1; overflow-y: auto; padding: 0 var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
.ol-drawer__title { margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -.015em; }
.ol-drawer__progress { padding: var(--space-4) var(--space-4) var(--space-5); border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-drawer__progresshead { display: flex; justify-content: space-between; margin-bottom: var(--space-4); font-size: 12px; font-weight: 700; color: var(--ink-muted); letter-spacing: .04em; text-transform: uppercase; }
.ol-drawer__progresshead b { color: var(--ink); letter-spacing: 0; text-transform: none; font-size: 12.5px; }
.ol-drawer__progress .ol-steps__node { background: var(--surface-sunken); }
.ol-drawer__progress .ol-steps__item.is-done .ol-steps__node { background: var(--teal); }
.ol-drawer__progress .ol-steps__item.is-current .ol-steps__node { background: var(--csoft); }
.ol-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); margin: 0; }
.ol-fields > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ol-fields dt { font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-fields dd { margin: 0; display: flex; align-items: center; min-height: 32px; }
.ol-fields__tags { gap: 6px; flex-wrap: wrap; }
.ol-drawer__sec { display: flex; flex-direction: column; gap: var(--space-3); }
.ol-drawer__sec h3 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.ol-drawer__sec h3 span { font-size: 12px; min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; display: inline-grid; place-items: center; border-radius: var(--radius-full); background: var(--surface-muted); color: var(--ink); }
.ol-drawer__sechead { display: flex; align-items: center; justify-content: space-between; }
.ol-drawer__secactions { display: flex; gap: 6px; }
.ol-drawer__desc { margin: 0; font-size: 15px; line-height: 24px; }
.ol-drawer__list { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 24px; }

.ol-thread { display: flex; flex-direction: column; gap: var(--space-3); }
.ol-drawer__foot { padding: var(--space-3) var(--space-5) var(--space-4); border-top: 1px solid var(--line); }

/* ---------- Projetos */
.ol-projgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); }
.ol-projcard { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-6); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); min-width: 0; }
.ol-projcard header { display: flex; align-items: center; gap: var(--space-3); }
.ol-projcard__name { flex: 1; min-width: 0; }
.ol-projcard h3 { margin: 0; font-size: 17px; line-height: 22px; font-weight: 700; }
.ol-projcard__name span { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.ol-projcard p { margin: 0; font-size: 13.5px; line-height: 20px; color: var(--ink-muted); }
.ol-projcard footer { display: flex; align-items: center; gap: var(--space-3); margin-top: auto; padding-top: var(--space-4); border-top: 1px solid var(--line); }
.ol-projcard__meta { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.ol-projcard--new { align-items: center; justify-content: center; text-align: center; gap: 6px; border: 1.5px dashed var(--line-strong); background: transparent; box-shadow: none; font: inherit; color: var(--ink); cursor: pointer; min-height: 240px; }
.ol-projcard--new:hover { background: var(--surface); }
.ol-projcard--new > span:last-child { font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.ol-projcard__plus { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: var(--on-primary); margin-bottom: 8px; }
.ol-archived { display: flex; flex-direction: column; }
.ol-archived__row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 140px 180px auto; align-items: center; gap: var(--space-3); min-height: 56px; border-top: 1px solid var(--line); }
.ol-archived__row:first-child { border-top: 0; }
.ol-archived__row > span { font-size: 13px; font-weight: 600; color: var(--ink-muted); }

/* ---------- Equipe */
.ol-statrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-5); }
.ol-loadkey { display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-right: 8px; }
.ol-loadkey span { display: inline-flex; align-items: center; gap: 6px; }
.ol-loadkey i { width: 8px; height: 8px; border-radius: 50%; }
.ol-team { display: flex; flex-direction: column; padding: 0 var(--space-3) var(--space-3); }
.ol-team__row { display: grid; grid-template-columns: minmax(220px, 1.3fr) 120px minmax(170px, 1fr) 180px 112px 132px 32px; align-items: center; gap: var(--space-3); min-height: 68px; padding: 0 var(--space-3); border-top: 1px solid var(--line); }
.ol-team__row--head { min-height: 36px; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); }
.ol-team__person { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.ol-team__person > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.ol-team__person b { font-size: 14px; }
.ol-team__person > span:last-child > span { font-size: 12.5px; color: var(--ink-muted); font-weight: 600; }
.ol-team__email { font-size: 13px; color: var(--ink-muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.ol-team__num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ol-team__projs { display: flex; gap: 4px; }
.ol-role { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 700; background: var(--surface-muted); color: var(--ink); white-space: nowrap; }
.ol-role--admin { background: var(--primary); color: var(--on-primary); }
.ol-teamgrid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-5); }
.ol-invites { display: flex; flex-direction: column; }
.ol-invites__row { display: flex; align-items: center; gap: var(--space-3); min-height: 60px; border-top: 1px solid var(--line); }
.ol-invites__row:first-child { border-top: 0; }
.ol-invites__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ol-invites__txt b { font-size: 14px; }
.ol-invites__txt > span { font-size: 12.5px; color: var(--ink-muted); font-weight: 600; }
.ol-invites__txt em { font-style: normal; color: var(--danger); }
.ol-roles { display: flex; flex-direction: column; gap: var(--space-4); }
.ol-roles p { margin: 6px 0 0; font-size: 13.5px; line-height: 20px; color: var(--ink-muted); }
.ol-pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; margin-left: 8px; border-radius: var(--radius-full); font-size: 11.5px; font-weight: 700; vertical-align: 1px; }
.ol-pill--ok { background: var(--teal-soft); color: var(--teal-strong); }

/* ---------- Configurações */
.ol-settings { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.ol-subnav { position: sticky; top: var(--space-5); display: flex; flex-direction: column; gap: 2px; padding: var(--space-3); border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); }
.ol-subnav__item { display: flex; align-items: center; gap: var(--space-3); height: var(--control-md); padding: 0 14px; border: 0; border-radius: var(--radius-full); background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.ol-subnav__item .ol-icon { color: var(--ink-muted); }
.ol-subnav__item:hover { background: var(--surface-sunken); }
.ol-subnav__item.is-active { background: var(--primary); color: var(--on-primary); }
.ol-subnav__item.is-active .ol-icon { color: var(--on-primary); }
.ol-subnav__note { display: flex; gap: 8px; margin: var(--space-2) 6px 4px; padding-top: var(--space-3); border-top: 1px solid var(--line); font-size: 12px; line-height: 17px; font-weight: 600; color: var(--ink-muted); }
.ol-settings__body { display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; }
.ol-stagelist, .ol-taglist { display: flex; flex-direction: column; gap: var(--space-2); }
.ol-stagelist__row { display: flex; align-items: center; gap: var(--space-3); height: 56px; padding: 0 8px 0 12px; border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-grip { color: var(--ink-muted); cursor: grab; }
.ol-stagelist__n { font-size: 12px; font-weight: 700; color: var(--ink-muted); width: 14px; }
.ol-swatch { width: 22px; height: 22px; padding: 0; border: 0; border-radius: var(--radius-xs); cursor: pointer; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 10%, transparent); }
.ol-stagelist__name { font-weight: 700; font-size: 14.5px; }
.ol-stagelist__note { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); background: var(--surface); color: var(--ink-muted); }
.ol-stagelist__count { margin-left: auto; font-size: 12.5px; color: var(--ink-muted); font-weight: 600; margin-right: 8px; }
.ol-flowpreview { margin-top: var(--space-4); font-size: 13px; font-weight: 600; }
.ol-flowpreview > span:first-child { margin-right: 6px; }
.ol-taglist__row { display: flex; align-items: center; gap: var(--space-4); height: 48px; padding: 0 8px 0 12px; border-radius: var(--radius-md); }
.ol-taglist__row:hover { background: var(--surface-sunken); }
.ol-taglist__row .ol-tag { min-width: 120px; }
.ol-taglist__use { flex: 1; display: flex; align-items: center; gap: var(--space-3); font-size: 13px; color: var(--ink-muted); font-weight: 600; }
.ol-taglist__bar { width: 180px; height: 8px; border-radius: var(--radius-full); background: var(--surface-muted); overflow: hidden; }
.ol-taglist__bar span { display: block; height: 100%; border-radius: var(--radius-full); }
.ol-switches { display: flex; flex-direction: column; }
.ol-switches .ol-switchrow { padding: var(--space-4) 0; border-top: 1px solid var(--line); }
.ol-switches .ol-switchrow:first-child { border-top: 0; padding-top: 0; }
.ol-integrations { display: flex; flex-direction: column; gap: var(--space-3); }
.ol-integ { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-integ__icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--radius-md); flex: none; }
.ol-integ__txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ol-integ__txt b { font-size: 15px; }
.ol-integ__txt > span { font-size: 13px; line-height: 19px; color: var(--ink-muted); font-weight: 600; }

/* ---------- Perfil */
.ol-profilehead { border-radius: var(--radius-xl); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
.ol-profilehead__cover { height: 150px; background-color: var(--sky); background-size: cover; background-position: center 92%; }
.ol-profilehead__body { display: flex; align-items: flex-end; gap: var(--space-5); padding: 0 var(--space-6) var(--space-6); margin-top: -40px; }
.ol-profilehead__body > .ol-avatar { box-shadow: 0 0 0 5px var(--surface); }
.ol-profilehead__body > .ol-avatar .ol-avatar__dot { right: 4px; bottom: 4px; box-shadow: 0 0 0 3px var(--surface); }
.ol-profilehead__txt { flex: 1; padding-bottom: 4px; }
.ol-profilehead__txt h2 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; }
.ol-profilehead__txt > span { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-muted); font-weight: 600; }
.ol-profilehead__actions { display: flex; gap: var(--space-2); padding-bottom: 4px; }
.ol-profilegrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.ol-stack { display: flex; flex-direction: column; gap: var(--space-5); }
.ol-minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
.ol-minis > div { display: flex; flex-direction: column; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--surface-sunken); }
.ol-minis b { font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; }
.ol-minis span { font-size: 12.5px; color: var(--ink-muted); font-weight: 600; }
.ol-profprojs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--space-4); }
.ol-profprojs > span { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: var(--radius-full); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 600; }
.ol-profprojs .ol-ptile { border-radius: 50% !important; }

.ol-quickadd { display: flex; align-items: center; gap: var(--space-2); height: var(--control-md); margin-top: var(--space-3); padding: 0 14px; border-radius: var(--radius-full); background: var(--surface-sunken); color: var(--ink-muted); box-shadow: inset 0 0 0 1px var(--line); }
.ol-quickadd:focus-within { box-shadow: var(--focus-ring); }
.ol-quickadd input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
.ol-quickadd input::placeholder { color: var(--ink-muted); }
.ol-quickadd__hint { font-size: 12px; font-weight: 700; }

/* ---------- Native select, pickers (Nova demanda) */
.ol-field__native { position: relative; }
.ol-field__native select { flex: 1; min-width: 0; height: 38px; margin: 0; padding: 0 22px 0 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); appearance: none; -webkit-appearance: none; cursor: pointer; }
.ol-field__native .ol-field__chev { position: absolute; right: 14px; pointer-events: none; color: var(--ink-muted); }
.ol-field__box input[type="date"] { min-height: 38px; }
.ol-chip--icon { padding: 0 14px 0 12px; gap: 6px; }
.ol-tagpick { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; font: inherit; cursor: pointer; border-radius: var(--radius-sm); }
.ol-tagpick:not(.is-on) .ol-tag { box-shadow: inset 0 0 0 1px var(--line-strong); }
.ol-tagpick__main { font-size: 11px; font-weight: 700; color: var(--ink-muted); }
.ol-modal { max-height: 100%; }
.ol-modal__body { overflow-y: auto; }
[data-theme="dark"] { color-scheme: dark; }
[data-theme="dark"] .ol-scrim { background: color-mix(in srgb, #000000 55%, transparent); }
.ol-topbar__title { flex: 1 1 auto; }
.ol-boardtitle > div { min-width: 0; }
.ol-boardtitle h1 { overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1400px) {
  .ol-userchip__txt { display: none; }
  .ol-userchip { padding-right: 10px; }
  .ol-topbar .ol-search--lg { width: 220px !important; }
}
.ol-field__box input:focus-visible, .ol-field__box textarea:focus-visible, .ol-field__box select:focus-visible, .ol-search input:focus-visible, .ol-composer__box input:focus-visible, .ol-quickadd input:focus-visible { box-shadow: none; }


/* Standalone page: the app fills the window, the sidebar stays put, overlays cover the viewport */
html, body { min-height: 100%; }
body { min-width: 1200px; }
.ol-app { overflow: visible; }
.ol-sidebar { position: sticky; top: 0; height: 100vh; box-sizing: border-box; overflow-y: auto; }
.ol-scrim { position: fixed; z-index: 50; }
.ol-table, .ol-team { overflow-x: auto; }
.ol-table__row { min-width: 1080px; box-sizing: border-box; }
.ol-team__row { min-width: 1064px; box-sizing: border-box; }

</style>
